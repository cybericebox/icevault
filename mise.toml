# mise: the pinned tools of this repository and its commands. One entry point for developers and CI.
#   mise install            install exactly these tool versions (once, and after this file changes)
#   mise tasks              list the commands
#   mise run <task> ...     run one; extra arguments go to the command

[tools]
go = "1.27.4"            # the same as the go line of go.mod
# Built with the pinned Go, not downloaded: a tool built by an older Go cannot parse the newer standard library.
"go:github.com/golangci/golangci-lint/v2/cmd/golangci-lint" = "2.14.0"
gitleaks = "8.30.1"        # the history and the tree are scanned before a release and on every pull request
actionlint = "1.7.12"      # the workflows under .github/workflows
shellcheck = "0.11.0"      # actionlint checks the scripts of the steps with it
"github:mokevnin/heavy" = "0.1.2"   # optional: a machine-wide semaphore that makes heavy commands of every checkout take turns; the tasks run without it
# mise.lock pins the URL and checksum of every tool for linux-x64, macos-arm64 and macos-x64; after a version change here run
# `mise lock -p linux-x64,macos-arm64,macos-x64`. CI installs with MISE_LOCKED=1: a tool missing from the lock, or an asset changed upstream, fails.

[env]
# This module is built on its own: the workspace go.work of a parent directory must not change what it resolves.
GOWORK = "off"
# The tool finds the project checkout (the folder of icevault-project.yaml) above the working directory; ICEVAULT_ROOT names another.
# ICEVAULT_ROOT = "/path/to/project"

[tasks.lint]
description = "golangci-lint for Linux (as CI) and for this machine"
run = ["GOOS=linux $(command -v heavy >/dev/null && echo heavy --) golangci-lint run ./...", "$(command -v heavy >/dev/null && echo heavy --) golangci-lint run ./..."]

[tasks.leaks]
description = "gitleaks over the whole git history and the working tree (values are redacted in the report)"
run = "gitleaks git --no-banner --redact --exit-code 1 ."

[tasks.lint-workflows]
description = "actionlint over .github/workflows"
run = "actionlint"

[tasks.fmt]
description = "go fmt"
run = "go fmt ./..."

[tasks.build]
description = "Build the program into bin/icevault (prints nothing when it succeeds, the full compiler error when it fails)"
quiet = true
# The version comes from VERSION (the tag in a release) or git describe; both programs of a build carry it (icevault --version).
run = '$(command -v heavy >/dev/null && echo heavy --) go build -ldflags "-X github.com/cybericebox/icevault/internal/version.Version=${VERSION:-$(git describe --tags --always --dirty 2>/dev/null || echo dev)}" -o bin/icevault ./cmd/icevault'

[tasks.test]
description = "Go tests: throwaway vaults in temp directories, throwaway passwords, no real vault, no network. The tests against keepassxc-cli run when it is installed and are skipped (with the reason) when it is not"
run = "$(command -v heavy >/dev/null && echo heavy --) go test ./..."

[tasks.check]
description = "Lint and test (what CI runs)"
run = [{ task = "lint" }, { task = "test" }]

[tasks.desktop-check]
description = "The desktop window program (build tags desktop; needs cgo and the platform webview): vet and test its adapter, and the browser test harness (tag harness). It is built only with the tags"
run = ["go vet -tags desktop,production ./cmd/icevault-desktop/...", "go test -tags desktop ./cmd/icevault-desktop/...", "go vet -tags harness ./cmd/icevault-desktop/...", "go test -tags harness ./cmd/icevault-desktop/..."]

[tasks.desktop-build]
description = "The same as desktop-app: the window is built only inside bin/IceVault.app, never as a loose bin/icevault-desktop (kept so that older callers still work)"
depends = ["desktop-app"]
quiet = true

[tasks.cross]
description = "Build for linux, windows and darwin (no cgo)"
run = ["CGO_ENABLED=0 GOOS=linux go build -o /dev/null ./cmd/icevault", "CGO_ENABLED=0 GOOS=windows go build -o /dev/null ./cmd/icevault", "CGO_ENABLED=0 GOOS=darwin go build -o /dev/null ./cmd/icevault"]

[tasks.install]
description = "Build the command line (bin/icevault) and, on macOS, the application bin/IceVault.app with the window and the command inside. Nothing is installed outside this directory and nothing is downloaded: the pinned Go builds it"
depends = ["build", "desktop-app"]
run = "echo built bin/icevault and bin/IceVault.app"

[tasks.usage-spec]
description = "Rewrite usage/icevault.usage.kdl (what mise reads for completion) from the command table of internal/cli/help.go; a test fails when the file is stale"
depends = ["build"]
quiet = true
run = "bin/icevault usage-spec > usage/icevault.usage.kdl"

[tasks.ui-harness]
description = "The browser test harness of the window (development only, never in a release): the page on 127.0.0.1 over the real desktop App. Usage: mise run ui-harness [-- --mode demo|file --addr 127.0.0.1:PORT --idle 10m --quit-after 30m]"
run = "go run -tags harness ./cmd/icevault-desktop"

[tasks.desktop-demo]
description = "The settings window on a throwaway vault of the example project, in a temp folder removed at the end (password demo; never your real vault). Usage: mise run desktop-demo [-- ...]"
depends = ["desktop-app"]
run = "bin/IceVault.app/Contents/MacOS/icevault-desktop --demo"
