* { box-sizing:border-box; }

  const p = mblock(main, t("m.env.products"), "package", [editing() ? btn(t("m.product.new"), "plus", () => mproductDialog(e, null)) : null], t("m.env.products_note"));
  if (!e.products.length) p.append(mempty(t("m.empty.products")));
  e.products.forEach((x) => mproduct(p, e, x));
}

function mimportDialog(e) {
  const keys = (nav.shared || []).map((r) => r.key);
  if (!keys.length) { say(t("m.empty.shared"), "info"); return; }
  panel.open(t("m.env.import_title", { env: e.name })); const box = panel.box; box.append(el("div", "note", t("m.env.import_note")));
  const chosen = new Set(e.imports); const list = el("div", "mchecks");
  keys.forEach((k) => { const id = "imp-" + k; const row = el("label", "mcheck"); row.htmlFor = id; const cb = el("input"); cb.type = "checkbox"; cb.id = id; cb.checked = chosen.has(k);
    cb.addEventListener("change", () => { if (cb.checked) chosen.add(k); else chosen.delete(k); }); const r = (nav.shared || []).find((x) => x.key === k); row.append(cb, el("span", "mono", k), el("span", "dim", r && mtext(r.label) ? mtext(r.label) : "")); list.append(row); });
  box.append(list);
  const err = el("div", "err"); err.setAttribute("role", "alert"); const actions = el("div", "actions"); const cancel = btn(t("btn.cancel"), "", () => panel.close(), "lg"); const ok = btn(t("btn.save"), "", null, "primary lg");
  ok.addEventListener("click", async () => { const done = busy(ok, t("busy.saving")); const r = await mwrite("m-import", { env: e.name, keys: keys.filter((k) => chosen.has(k)) }); if (r === true) panel.close(); else { done(); err.textContent = ""; err.append(icon("alert"), document.createTextNode(r)); } });
  actions.append(cancel, ok); box.append(err, actions); cancel.focus();
}

function mselectRow(parent, label, box) { const row = el("div", "mfield"); row.append(el("span", "lbl", label), box); parent.append(row); }

function msite(parent, e, x) {
  x = Object.assign({}, x, { users: x.users.map((u) => { const p = e.products.find((q) => q.name === u); return p ? prodTitle(p) : u; }) });   // product titles, not their keys
  const card = el("div", "mcard"); const h = el("div", "mcard-h"); h.append(icon("server"), el("b", "", x.name), el("span", "tag", skTitle(x.kind)));
  mfold(card, h, mscope() + "|site|" + x.name);
  h.append(el("span", "dim", x.users.length ? t("m.site.used_by", { list: x.users.join(", ") }) : t("m.site.unused"))); h.append(el("span", "grow"));
  if (editing()) h.append(ibtn("edit", t("m.site.rename", { name: x.name }), () => msiteDialog(e, x)), ibtn("archive", t("m.site.delete", { name: x.name }), () => mdelete(t("m.site.delete_title", { name: x.name }), x.users.length ? t("m.site.delete_used", { list: x.users.join(", ") }) : t("m.site.delete_note"), "m-site", { env: e.name, action: "delete", name: x.name }), "danger"));
  card.append(h);
  const ctl = el("div", "mctl");
  const kinds = (nav.site_kinds || []).filter((k) => k.supported || k.id === x.kind).map((k) => [k.id, skTitle(k.id)]);
  const conns = (kind) => [["", t("m.site.no_connection")]].concat((nav.connections || []).filter((c) => c.kind === kind).map((c) => [c.uuid, c.name]));
  if (editing()) {
    mselectRow(ctl, t("m.site.kind"), selectBox({ value: x.kind, options: kinds, label: t("m.site.kind"), onChange: (v) => mwrite("m-site", { env: e.name, action: "update", name: x.name, kind: v }) }).el);
    if (x.needs_connection) mselectRow(ctl, t("m.site.connection"), selectBox({ value: x.connection, options: conns(x.needs_connection), label: t("m.site.connection"), onChange: (v) => mwrite("m-site", { env: e.name, action: "update", name: x.name, connection: v }) }).el);
    else mselectRow(ctl, t("m.site.connection"), el("span", "dim", t("m.site.local")));
    if (x.state_kind) mselectRow(ctl, t("m.site.state"), selectBox({ value: x.state, options: conns("hcp"), label: t("m.site.state"), onChange: (v) => mwrite("m-site", { env: e.name, action: "update", name: x.name, state: v }) }).el);
  } else {
    const cn = connOf(x.connection); mselectRow(ctl, t("m.site.connection"), el("b", "", x.needs_connection ? (cn ? cn.name : t("m.site.no_connection")) : t("m.site.local")));
    if (x.state_kind) { const sc = connOf(x.state); mselectRow(ctl, t("m.site.state"), el("b", "", sc ? sc.name : t("m.site.no_connection"))); }
  }
  card.append(ctl);
  const vs = el("div", "msub"); const vh = el("div", "msub-h"); vh.append(el("span", "", t("m.site.settings")), el("span", "grow")); vs.append(vh); mfold(vs, vh, mscope() + "|site|" + x.name + "|vars");
  if (editing()) vh.append(btn(t("m.btn.add_var"), "plus", () => mvarDialog("env/" + e.name + "/site/" + x.name, null)));
  mvars(vs, x.vars, "env/" + e.name + "/site/" + x.name); card.append(vs); parent.append(card);
}

function msiteDialog(e, x) {
  if (x) { dialog(t("m.site.rename", { name: x.name }), [{ name: "name", label: t("m.f.name"), value: x.name, required: true, help: t("m.thing.name_help") }], t("btn.save"), (v) => mwrite("m-site", { env: e.name, action: "update", name: x.name, new_name: v.name.trim() })); return; }
  const kinds = (nav.site_kinds || []).filter((k) => k.supported).map((k) => [k.id, skTitle(k.id)]);
  dialog(t("m.site.new_title", { env: e.title || e.name }), [{ name: "name", label: t("m.f.name"), value: e.sites.length ? "" : "main", required: true, help: t("m.thing.name_help") }, { name: "kind", label: t("m.site.kind"), type: "select", value: kinds.length ? kinds[0][0] : "", options: kinds }],
    t("btn.create"), (v) => mwrite("m-site", { env: e.name, action: "create", name: v.name.trim(), kind: v.kind }));
}

function mproduct(parent, e, p) {
  const card = el("div", "mcard" + (p.enabled ? "" : " off")); const h = el("div", "mcard-h"); h.append(icon("package"), el("b", "", prodTitle(p)));
  mfold(card, h, mscope() + "|product|" + p.name);
  if (prodTitle(p) !== p.name) h.append(el("span", "quiet mono", p.name));
  if (editing()) { const id = "on-" + e.name + "-" + p.name; const lab = el("label", "mswitch"); lab.htmlFor = id; const cb = el("input"); cb.type = "checkbox"; cb.id = id; cb.checked = p.enabled; cb.addEventListener("change", () => mwrite("m-product", { env: e.name, action: "update", name: p.name, enabled: cb.checked })); lab.append(cb, el("span", "", t("m.product.switch"))); h.append(lab); }
  else h.append(el("span", "tag" + (p.enabled ? "" : " warn"), p.enabled ? t("m.product.on") : t("m.product.off")));
  h.append(el("span", "grow"));
  if (editing()) h.append(ibtn("edit", t("m.product.rename", { name: p.name }), () => mproductDialog(e, p)), ibtn("archive", t("m.product.delete", { name: p.name }), () => mdelete(t("m.confirm_delete_product.title", { name: p.name }), t("m.confirm_delete_product.note"), "m-product", { env: e.name, action: "delete", name: p.name }), "danger"));
  card.append(h);
  if (mtext(p.help)) card.append(el("p", "dim mnote", mtext(p.help)));
  const ctl = el("div", "mctl");
  const site = e.sites.find((s) => s.uuid === p.site);
  if (editing()) mselectRow(ctl, t("m.product.site"), selectBox({ value: p.site, options: [["", t("m.product.no_site")]].concat(e.sites.map((s) => [s.uuid, s.name + " · " + skTitle(s.kind)])), label: t("m.product.site"), onChange: (v) => mwrite("m-product", { env: e.name, action: "update", name: p.name, site: v }) }).el);
  else mselectRow(ctl, t("m.product.site"), el("b", "", site ? site.name : t("m.product.no_site")));
  const chosen = new Set(p.connections); const chips = el("span", "mchips");
  p.connections.forEach((u) => { const c = connOf(u); if (c) { const b = el("button", "chip nm2"); b.type = "button"; b.textContent = connLabel(c); b.addEventListener("click", () => mselect("connections", "")); chips.append(b); } });
  if (!p.connections.length && !editing()) chips.append(el("span", "dim", t("m.product.no_connections")));
  if (editing()) {
    const wanted = (c) => !p.needs.length || p.needs.some((n) => n.kind === c.kind);   // only the kinds the product can use
    const toggles = (nav.connections || []).filter((c) => wanted(c) || chosen.has(c.uuid)).map((c) => ({ label: connLabel(c), checked: chosen.has(c.uuid), onChange: (on) => { if (on) chosen.add(c.uuid); else chosen.delete(c.uuid); mwrite("m-product", { env: e.name, action: "update", name: p.name, connections: [...chosen] }); } }));
    if (toggles.length) chips.append(selectBox({ value: "", options: [], toggles, label: t("m.product.connections"), placeholder: t("m.product.choose") }).el);
  }
  mselectRow(ctl, t("m.product.connections"), chips);
  if (p.needs.length) mselectRow(ctl, t("m.product.needs"), el("span", "dim", p.needs.map((n) => ckTitle(n.kind) + (n.optional ? " (" + t("m.product.optional") + ")" : "")).join(", ")));
  card.append(ctl);
  if (p.enabled) {
    const m = el("div", "banner" + (p.missing.length ? " warn" : " ok")); m.append(icon(p.missing.length ? "alert" : "ok"));
    const d = el("div"); d.append(el("div", "", p.missing.length ? tn("m.missing_n", p.missing.length) : t("m.product.ready")));
    if (p.missing.length) { const ul = el("ul", "mmissing"); p.missing.forEach((x) => ul.append(el("li", "", mmissText(x)))); d.append(ul); }
    m.append(d); card.append(m);
  }
  const vs = el("div", "msub"); const vh = el("div", "msub-h"); vh.append(el("span", "", t("m.product.vars")), el("span", "grow")); vs.append(vh); mfold(vs, vh, mscope() + "|product|" + p.name + "|vars");
  if (editing()) vh.append(btn(t("m.btn.add_var"), "plus", () => mvarDialog("env/" + e.name + "/product/" + p.name, null)));
  mvars(vs, p.vars, "env/" + e.name + "/product/" + p.name); card.append(vs);
  if (p.sub) { const ss = el("div", "msub"); const sh = el("div", "msub-h"); sh.append(el("span", "", t("m.product.on_kind", { kind: skTitle(p.sub.kind) })), el("span", "grow")); ss.append(sh); mfold(ss, sh, mscope() + "|product|" + p.name + "|sub"); mvars(ss, p.sub.vars, "env/" + e.name + "/product/" + p.name + "/" + p.sub.kind); card.append(ss); }
  parent.append(card);
}

function mmissText(x) {
  switch (x.where) {
    case "site": return t("m.miss.site");
    case "site_connection": return t("m.miss.site_connection", { kind: ckTitle(x.key), site: x.site || "" });
    case "connection": return t("m.miss.connection", { kind: ckTitle(x.key) });
    case "connection_field": return t("m.miss.field", { name: mtext(x.label) || x.key, connection: x.connection });
    default: return t("m.miss." + x.where, { name: mtext(x.label) || x.key });
  }
}

function mproductDialog(e, p) {
  if (p) { dialog(t("m.product.rename", { name: p.name }), [{ name: "name", label: t("m.f.name"), value: p.name, required: true, help: t("m.thing.name_help") }], t("btn.save"), (v) => mwrite("m-product", { env: e.name, action: "update", name: p.name, new_name: v.name.trim() })); return; }
  const known = (nav.products || []).filter((x) => !e.products.some((y) => y.name === x.name)).map((x) => [x.name, mtext(x.title) || x.name]);
  const fields = known.length ? [{ name: "name", label: t("m.f.product"), type: "select", value: known[0][0], options: known }] : [{ name: "name", label: t("m.f.name"), required: true, help: t("m.thing.name_help") }];
  dialog(t("m.product.new_title", { env: e.title || e.name }), fields, t("btn.create"), (v) => mwrite("m-product", { env: e.name, action: "create", name: String(v.name).trim() }));
}

// ---------------------------------------------------------------- the move of a vault of the layout before the model (offered on its pages)
// the project description, when the checkout has none: chosen in the system file dialog (.yaml, .yml) and remembered for the window (no vault write)
async function mprojectDialog() {
  if (!editing() && !(await setMode("edit"))) return;
  const r = await api("/api/project-choose", { title: t("m.desc.choose_title") });
  if (r.status !== 200) { say(srv(r.data), "err"); return; }
  if (r.data && r.data.cancelled) return;
  panel.close(); nav = null; await loadNav(); say(t("m.desc.saved"), "ok");
}

function renderMigrationBanner(main) {
  const mg = nav && nav.migration; if (!mg || !mg.offer) return;
  const b = el("div", "banner"); b.append(icon("info")); const d = el("div"); d.append(el("div", "", t("mig.banner")));
  if (!mg.description) d.append(el("div", "dim", t("mig.no_desc")));
  b.append(d); if (!mg.description) b.append(btn(t("m.desc.choose"), "edit", mprojectDialog)); b.append(btn(t("mig.open"), "move", openMigration)); main.append(b);
}

async function openMigration() {
  panel.open(t("mig.title")); const box = panel.box; box.classList.add("wide");
  const ld = el("div", "vload"); ld.setAttribute("role", "status"); ld.append(el("span", "crest"), el("span", "dim", t("mig.loading"))); box.append(ld);
  const r = await api("/api/migrate-plan"); ld.remove();
  if (r.status !== 200) { const e = el("div", "err"); e.append(icon("alert"), document.createTextNode(srv(r.data))); box.append(e); const a0 = el("div", "actions"); a0.append(btn(t("btn.close"), "", () => panel.close(), "lg")); box.append(a0); return; }
  const p = r.data;
  if (!p.description || !p.description.found) { box.append(el("div", "note", t("mig.no_desc"))); const a = el("div", "actions"); a.append(btn(t("btn.close"), "", () => panel.close(), "lg"), btn(t("m.desc.choose"), "edit", () => { panel.close(); mprojectDialog(); }, "primary lg")); box.append(a); return; }
  box.append(el("div", "note", t("mig.intro")));
  const list = (title, items, fmt) => { if (!items || !items.length) return; const s = el("div", "mplan"); s.append(el("h3", "", t(title, { n: items.length }))); const ul = el("ul"); items.forEach((x) => ul.append(el("li", "", fmt ? fmt(x) : x))); s.append(ul); box.append(s); };
  // a line of the report in words of the window: the code and its arguments (kinds by their titles), never the English text of the command line
  const why = (l) => { const a = Object.assign({ key: l.key || "", file: l.file || "", from: l.from || "" }, l.args || {});
    if (l.code === "conn") a.kind = ckTitle(a.kind); else { if (a.kind) a.kind = skTitle(a.kind); if (a.site_kind) a.site_kind = skTitle(a.site_kind); }
    if (a.when) a.when = fullTime(a.when);
    return t("mig.why." + l.code, a); };
  const keyed = (l) => { const li = el("li"); if (l.key) li.append(el("b", "mono", l.key), document.createTextNode(" ")); li.append(el("span", "dim", why(l))); return li; };
  // dropped and Other: grouped by the project file the value belonged to (else the item that held it)
  const grouped = (title, items) => { if (!items || !items.length) return; const s = el("div", "mplan"); s.append(el("h3", "", t(title, { n: items.length })));
    const groups = new Map(); items.forEach((l) => { const g = l.file || l.from || "-"; if (!groups.has(g)) groups.set(g, []); groups.get(g).push(l); });
    [...groups.keys()].sort().forEach((g) => { s.append(el("div", "mgroup mono", g)); const ul = el("ul"); groups.get(g).forEach((l) => ul.append(keyed(l))); s.append(ul); });
    box.append(s); };
  const lines = (title, items) => { if (!items || !items.length) return; const s = el("div", "mplan"); s.append(el("h3", "", t(title, { n: items.length }))); const ul = el("ul"); items.forEach((l) => ul.append(keyed(l))); s.append(ul); box.append(s); };
  list("mig.envs", p.envs, (e) => t("mig.env", { name: e.name, kind: skTitle(e.site_kind), products: (e.products || []).length, general: (e.general || []).length + (e.imports || []).length, site: (e.site || []).length }));
  list("mig.connections", p.connections, (l) => why(l));
  list("mig.shared", p.shared);
  lines("mig.flagged", p.flagged);
  lines("mig.replaced", p.replaced);
  grouped("mig.dropped", p.dropped);
  grouped("mig.other", p.other);
  list("mig.problems", p.problems, (l) => why(l));
  box.append(el("div", "note", t("mig.copy", { copy: p.copy })));
  const err = el("div", "err"); err.setAttribute("role", "alert"); const a = el("div", "actions"); const cancel = btn(t("btn.cancel"), "", () => panel.close(), "lg"); const go = btn(t("mig.btn"), "", null, "primary lg"); go.disabled = !p.ok;
  go.addEventListener("click", () => confirmBox(t("mig.confirm_title"), t("mig.confirm_note", { copy: p.copy }), t("mig.btn_ok"), { onOk: async () => {
    if (!editing() && !(await setMode("edit"))) return t("err.refused");
    const x = await api("/api/migrate-apply", {}); if (x.status !== 200) return srv(x.data);
    panel.close(); sel = null; item = null; nav = null; msel = null; await loadNav(); say(t("mig.done", { copy: x.data.copy || p.copy }), "ok"); return true; } }));
  a.append(cancel, go); box.append(err, a); cancel.focus();
}
</script>
